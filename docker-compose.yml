# Development: `docker compose up db` and run the API from a venv, or `up`
# with no argument to build and run the image the way production does.
#
# Redis and the worker join when there is a job for them (bulk import,
# Open Library lookups); nothing in the MVP's first slice queues anything.

services:
  db:
    # Postgres 18 with pgvector, for the ingredient embeddings (0029): the
    # major version production runs, and the same image as CI. Trixie, so it
    # sorts text like the stock Debian postgres:18 image; production's move
    # to its own server on it is in SCOPING.md, LLM-assisted data processing.
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: openlarder
      POSTGRES_PASSWORD: openlarder
      POSTGRES_DB: openlarder
    ports:
      # Not 5432, which a host Postgres or another project's container may
      # already hold.
      - "54320:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql, and a
      # new volume name keeps an old Postgres 17 volume out of it.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlarder -d openlarder"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENLARDER_DATABASE_URL: postgresql+psycopg://openlarder:openlarder@db:5432/openlarder
      OPENLARDER_ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  pgdata18:
