<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" role="img" aria-label="OpenLarder">
  <!-- Placeholder wordmark: the favicon's jar beside the name, on its own
       dark tile so it reads on Authentik's light and dark login cards.
       textLength pins the name's width, since the font is whatever the
       viewer's system has and widths differ between them. -->
  <rect width="248" height="64" rx="14" fill="#1f1e1c"/>
  <rect x="20" y="11" width="24" height="7" rx="2" fill="#e0a24a"/>
  <rect x="23" y="18" width="18" height="5" fill="#b9792f"/>
  <rect x="15" y="23" width="34" height="31" rx="8" fill="#e0a24a"/>
  <rect x="20" y="31" width="24" height="14" rx="2" fill="#fbfaf7"/>
  <rect x="23" y="35" width="18" height="2" rx="1" fill="#1f1e1c"/>
  <rect x="23" y="39.5" width="11" height="2" rx="1" fill="#1f1e1c"/>
  <text x="62" y="42" textLength="168" lengthAdjust="spacingAndGlyphs"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="27" font-weight="600" fill="#fbfaf7">OpenLarder</text>
</svg>
