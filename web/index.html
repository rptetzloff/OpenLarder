<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2E4A3B" />
    <link rel="preload" href="/fonts/outfit-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>OpenLarder</title>
    <meta name="description" content="A free, open index of cookbook recipes: find where a recipe is, and what goes in it." />
    <meta property="og:site_name" content="OpenLarder" />
    <meta property="og:title" content="OpenLarder" />
    <meta property="og:description" content="A free, open index of cookbook recipes." />
    <meta property="og:image" content="https://openlarder.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The theme before anything is drawn, so a dark choice never flashes
      // light first. theme.ts keeps it in step afterwards.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("openlarder_theme");
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
