# Lint, tests against a real Postgres, the SPA's typecheck and build, and the
# image. Separate jobs, because a green test job says nothing about lint, and
# a sibling repo shipped red lint behind a green suite for exactly that reason.
#
# Postgres 17 with pgvector, what the compose file runs and production must
# too (migration 0029 needs the extension).

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: openlarder
          POSTGRES_PASSWORD: openlarder
          POSTGRES_DB: openlarder
        ports:
          - 5432:5432
        # Without this the job can connect before the server accepts
        # connections, which fails intermittently and looks like a flaky test.
        options: >-
          --health-cmd "pg_isready -U openlarder -d openlarder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OPENLARDER_DATABASE_URL: postgresql+psycopg://openlarder:openlarder@localhost:5432/openlarder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      # The suite migrates its own throwaway database; this is the migration
      # run the way the entrypoint runs it, against the configured one.
      - run: alembic upgrade head
      - name: Models match the migration
        run: alembic check
      - run: pytest
      - name: What this run does not cover
        if: always()
        # alembic check is blind to CHECK constraints and expression indexes;
        # the schema tests cover those. Said here so a green run is not read
        # as more than it is.
        run: |
          echo "Covered: schema constraints, migration up and down, models vs migration."
          echo "NOT covered: CHECK constraints and expression indexes by alembic check (tests cover their behaviour, and CHECK names against the models)."

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ci, not install: it fails on a lockfile that disagrees with
      # package.json rather than quietly resolving something new.
      - run: npm ci
      - run: npm run build

  # Every kind of page, as the built image serves it, through axe-core's WCAG
  # 2.1 A and AA rules (contrast among them) in light and dark, and for
  # sideways scrolling at phone width (web/a11y/check.mjs). Ray, 2026-11-08:
  # accessibility and contrast checked along the way. It adds a sample
  # catalog through the API, so it runs against this job's own database, with
  # web recipes asking the Internet Archive for nothing.
  a11y:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: openlarder
          POSTGRES_PASSWORD: openlarder
          POSTGRES_DB: openlarder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlarder -d openlarder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker build -t openlarder:a11y .
      - name: Run the image
        run: |
          docker run -d --name app --network host \
            -e OPENLARDER_DATABASE_URL=postgresql+psycopg://openlarder:openlarder@localhost:5432/openlarder \
            -e OPENLARDER_ARCHIVE_WEB_PAGES=false \
            openlarder:a11y
          for i in $(seq 1 60); do curl -sf localhost:8000/readyz && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Plant the people the check signs in as
        run: psql postgresql://openlarder:openlarder@localhost:5432/openlarder -v ON_ERROR_STOP=1 -f web/a11y/users.sql
      - run: npm ci
        working-directory: web
      - run: node a11y/check.mjs
        working-directory: web
      - if: failure()
        run: docker logs app

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The deployment artifact. Building it is the check that nothing the
      # image needs was left out of the Dockerfile.
      - run: docker build -t openlarder:ci .
